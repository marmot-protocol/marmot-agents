\* Unfair: after a kill, the person never runs an installer again (no FairPerson). L1 must fail.
\* Bounds: 1 run the person starts, 1 kill (SIGKILL) and 0 runs that fail or are stopped (TERM). InstallUpgrade.md says more.
SPECIFICATION Spec
CONSTANTS
    Harnesses = {"pi"}
    Main = "pi"
    Older = TRUE
    FirstRuns = 1
    Slots = {1}
    MaxKills = 1
    MaxFails = 0
    FairPerson = FALSE
    Agents = {"a"}
    Bug = "none"
INVARIANTS TypeOK U1 U2 U3
PROPERTIES L1
