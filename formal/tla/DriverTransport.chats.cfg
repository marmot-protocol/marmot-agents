\* Two chats on one harness, fair: every property must hold. ACP's shape, whose approvals are
\* named after their session and tool call, with each chat's request for the same tool call. The
\* small bounds: two chats, two requests of the harness, one answer, one interrupt, two prompts;
\* no death, no new session (DriverTransport.acp.cfg has them).
SPECIFICATION Spec
CONSTANTS
    Chats = {"c1", "c2"}
    Asks = {"a1", "a2"}
    Calls = {"k1"}
    Answers = {"r1"}
    Interrupts = {"r2"}
    NewSessions = {}
    MaxSessions = 5
    MaxPrompts = 2
    MaxDeaths = 0
    MaxEdits = 0
    PerChat = FALSE
    SelfResolves = FALSE
    Unshowable = FALSE
    StrayAsks = FALSE
    CallNamed = TRUE
    CancelOnInterrupt = TRUE
    ReaskAfterRestart = FALSE
    FairDriver = TRUE
    FairHarness = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S5 S11 S13
PROPERTIES L1 L2
