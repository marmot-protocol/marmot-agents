\* Fair: every property must hold. The small bounds, for every pull request: one chat, one
\* prompt, one control (a new-session control), the session item (2 events from the driver, 3
\* versions with the close), 1 down, 1 unknown outcome, 1 try MDK drops (tried again under a new
\* token; two such tries would give the send up), and a live stream that may lag at any idle
\* moment. MDK keeps each send under its token (TokenDedupe). README.md has the larger bounds.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    MaxRefusals = 0
    MaxRejected = 1
    RejectedTries = 2
    GoneChats = {}
    TokenDedupe = TRUE
    TickCatchUp = TRUE
    LiveAfterStore = TRUE
    LastResortTaken = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
