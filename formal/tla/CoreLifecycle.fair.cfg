\* Fair: every property must hold. The small bounds, for every pull request: one chat, one
\* prompt, one control (a new-session control), the session item (2 events from the driver, 3
\* versions with the close), 1 down, 1 unknown outcome, and a live stream that may lag at any
\* idle moment. README.md has the larger bounds.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    MaxRefusals = 0
    UnknownTries = 2
    GoneChats = {}
    ExactLookup = TRUE
    TokenDedupe = FALSE
    LagCatchUp = TRUE
    LiveInOrder = TRUE
    LiveAfterStore = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
