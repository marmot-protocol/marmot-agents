\* MDK fails to read a message for a moment (NotNow): the core leaves the mark and the message
\* alone, marks the chat waiting (`unread`), and reads it again (`ReadAgain`). Every property
\* must hold, without TickCatchUp, even when another message arrives while the chat waits (S10,
\* L1, L3). The deliberate defect SkipUnread moves the mark on a failure and breaks L3
\* (counterexamples/skip-unread.json) and S10.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 0
    MaxRefusals = 0
    MaxRejected = 0
    MaxReadFails = 1
    RejectedTries = 2
    GoneChats = {}
    TokenDedupe = TRUE
    TickCatchUp = FALSE
    LiveAfterStore = TRUE
    LastResortTaken = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
