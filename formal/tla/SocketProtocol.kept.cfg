\* Fair, Hermes: the gateway goes on, with one connector across connections, which may hold a turn's end.
\* Every property must hold. The small bounds, for every pull request: one prompt and its turn,
\* one interrupt, and 2 connections that go (a drop or a give-up).
SPECIFICATION Spec
CONSTANTS
    Connector = "kept"
    Holds = TRUE
    MaxDrops = 2
    TakenInTime = TRUE
    Supervised = TRUE
    FairConnector = TRUE
    FairHarness = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S11
PROPERTIES L1 L2 L4
