\* MDK refuses one send to a live group for good (too large, or a payload it will not take; it
\* refuses the same send again), and the group stays live. S2 must fail: an item whose closing
\* version is refused stays open in the chat, as when it is given up,
\* counterexamples/refuse-leaves-item-open.json. The failed notice for a refused version is
\* checked with S3Told by tools/tla/check.py, without S2 and L1.
SPECIFICATION Spec
