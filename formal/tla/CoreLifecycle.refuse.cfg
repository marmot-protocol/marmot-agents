\* MDK refuses one send to a live group for good (too large, or a payload it will not take; it
\* refuses the same send again), and the group stays live. Every property must hold: an item whose
\* closing version is refused is closed in the chat by the core's own close (S2, L2), and the chat
\* is told of the gap (S3Told). tools/tla/check.py also runs it with two refusals: with
\* LastResortTaken the safety properties and L1 to L3 hold; without it, MDK refuses the close too
\* and S2 fails, the accepted limit (counterexamples/last-resort-refused.json).
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 0
    MaxRefusals = 1
    UnknownTries = 2
    GoneChats = {}
    ExactLookup = TRUE
    TokenDedupe = FALSE
    LagCatchUp = FALSE
    LiveInOrder = TRUE
    LiveAfterStore = TRUE
    LastResortTaken = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
