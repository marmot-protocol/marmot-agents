\* MDK takes a send and drops it before it goes out, and the core gives it up after one such try
\* (the code: ten). Every property must hold: an item whose closing version is given up is closed
\* in the chat by the core's own close, a last resort (S2, L2), and the chat is told of the gap
\* (S3Told). Before the fix it stayed open for ever; the deliberate defect NoReplacement shows
\* that again.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    MaxRefusals = 0
    MaxRejected = 1
    RejectedTries = 1
    GoneChats = {}
    TokenDedupe = TRUE
    TickCatchUp = FALSE
    LiveAfterStore = TRUE
    LastResortTaken = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
