\* Fair, a first install of Pi in a container, with nothing there before; a run after a kill may be of Codex. Every property must hold.
\* Bounds: 1 run the person starts, 2 kills (SIGKILL) and 2 runs that fail or are stopped (TERM). InstallUpgrade.md says more.
SPECIFICATION Spec
CONSTANTS
    Harnesses = {"pi", "codex"}
    Main = "pi"
    Older = FALSE
    FirstRuns = 1
    Slots = {1}
    MaxKills = 2
    MaxFails = 2
    FairPerson = TRUE
    Bug = "none"
INVARIANTS TypeOK U1 U2
PROPERTIES L1
