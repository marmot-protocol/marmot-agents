\* Fair, two Claude Code installs started at once in one home; a run after a kill may be of Codex. Every property must hold.
\* Bounds: 2 runs the person starts, 2 kills (SIGKILL) and 2 runs that fail or are stopped (TERM). InstallUpgrade.md says more.
SPECIFICATION Spec
CONSTANTS
    Harnesses = {"claude", "codex"}
    Main = "claude"
    Older = TRUE
    FirstRuns = 2
    Slots = {1, 2}
    MaxKills = 2
    MaxFails = 2
    FairPerson = TRUE
    Bug = "none"
INVARIANTS TypeOK U1 U2
PROPERTIES L1
