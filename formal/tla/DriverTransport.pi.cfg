\* Pi's shape, fair: every property must hold. A Pi for each chat, started again on the chat's
\* session when it dies; Pi drops a request when its turn ends and says nothing of it. The small
\* bounds: two chats, each with its own Pi, one request of the harness, one answer, one
\* interrupt, one new-session control, two prompts, one death.
SPECIFICATION Spec
CONSTANTS
    Chats = {"c1", "c2"}
    Asks = {"a1"}
    Calls = {"k1"}
    Answers = {"r1"}
    Interrupts = {"r2"}
    NewSessions = {"r3"}
    MaxSessions = 5
    MaxPrompts = 2
    MaxDeaths = 1
    MaxEdits = 0
    PerChat = TRUE
    SelfResolves = FALSE
    Unshowable = FALSE
    StrayAsks = FALSE
    CallNamed = FALSE
    CancelOnInterrupt = FALSE
    ReaskAfterRestart = FALSE
    FairDriver = TRUE
    FairHarness = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S5 S11 S13
PROPERTIES L1 L2
