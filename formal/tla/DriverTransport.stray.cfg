\* ACP's shape with requests from a session no chat has (StrayAsks), fair: every property must
\* hold. The driver answers such a request with -32002, at once, or, when it comes while a
\* session is being picked, once none is (#122). DriverTransport.acp.cfg with one request of the
\* harness, in any session, and one chat.
SPECIFICATION Spec
CONSTANTS
    Chats = {"c1"}
    Asks = {"a1"}
    Calls = {"k1"}
    Answers = {"r1"}
    Interrupts = {"r2"}
    NewSessions = {"r3"}
    MaxSessions = 5
    MaxPrompts = 2
    MaxDeaths = 1
    MaxEdits = 1
    PerChat = FALSE
    SelfResolves = FALSE
    Unshowable = TRUE
    UnshownAnswered = TRUE
    StrayAsks = TRUE
    StrayAnswered = TRUE
    CallNamed = TRUE
    CancelOnInterrupt = TRUE
    ReaskAfterRestart = FALSE
    FairDriver = TRUE
    FairHarness = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S5 S11 S13
PROPERTIES L1 L2
