\* MDK takes a send and drops it before it goes out, and the core gives it up after one such try
\* (the code: ten), with no item, so the notice that settles r1 is what is given up. Every property
\* must hold: a failed notice settles r1 in its place, a last resort (L1).
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    MaxRefusals = 0
    MaxRejected = 1
    MaxReadFails = 0
    RejectedTries = 1
    GoneChats = {}
    TokenDedupe = TRUE
    TickCatchUp = FALSE
    LiveAfterStore = TRUE
    LastResortTaken = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
