\* A send whose outcome stays unknown is given up after one try (the code: ten), with no item, so
\* the case CoreLifecycle.giveup.cfg shows cannot come first. L1 must fail:
\* a notice given up takes the requests it settles with it,
\* counterexamples/give-up-drops-settles.trace.txt.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    Items = {}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    UnknownTries = 1
    GoneChats = {}
    ExactLookup = TRUE
    TokenDedupe = FALSE
    LagCatchUp = FALSE
    LiveInOrder = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1
