\* Without TokenDedupe: MDK does not know a send tried again is one it already posted, as before
\* MDK 0.19.0's token-based sends. S3 must fail: the duplicate first event,
\* counterexamples/duplicate-first-event.json. No send has an unknown outcome here, so the trace
\* is the crash: a first version posted, the save after it lost, and the version sent again after
\* the restart. With one, a send whose reply was lost gives the same duplicate without a crash.
