\* No crash-safe tagged sends: a lookup may miss a send MDK posted (MDK published it and did
\* not store it before a crash, or the core cannot tell it from an earlier one). S3 must fail:
\* the known duplicate first event, counterexamples/duplicate-first-event.trace.txt. No send has an
\* unknown outcome here, so the trace is the crash; with one, a lookup that misses a send whose
\* reply was lost gives the same duplicate without a crash.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 0
    UnknownTries = 2
    GoneChats = {}
    ExactLookup = FALSE
    TokenDedupe = FALSE
    LagCatchUp = FALSE
    LiveInOrder = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12

