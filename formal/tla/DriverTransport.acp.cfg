\* ACP's shape, fair: every property must hold. One agent; the driver answers at once a request
\* it cannot show (-32602), and, when it interrupts, each request still waiting, as cancelled;
\* an approval's item is named after its session and tool call, and two requests for one call
\* are two items. The small bounds: one chat, two requests of the harness for one tool call, one
\* answer, one interrupt, one new-session control, two prompts, one death, one session item shown
\* again unasked. No request from a session no chat has: DriverTransport.stray.cfg.
SPECIFICATION Spec
CONSTANTS
    Chats = {"c1"}
    Asks = {"a1", "a2"}
    Calls = {"k1"}
    Answers = {"r1"}
    Interrupts = {"r2"}
    NewSessions = {"r3"}
    MaxSessions = 5
    MaxPrompts = 2
    MaxDeaths = 1
    MaxEdits = 1
    PerChat = FALSE
    SelfResolves = FALSE
    Unshowable = TRUE
    UnshownAnswered = TRUE
    StrayAsks = FALSE
    StrayAnswered = TRUE
    CallNamed = TRUE
    CancelOnInterrupt = TRUE
    ReaskAfterRestart = FALSE
    FairDriver = TRUE
    FairHarness = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S5 S11 S13
PROPERTIES L1 L2
