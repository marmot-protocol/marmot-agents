\* Codex's shape, fair: every property must hold. One `codex app-server`; Codex resolves a
\* request by itself and says so (`serverRequest/resolved`), also for each request a turn's end
\* drops; an approval's item is named after the request. The small bounds, for every pull request:
\* one chat, two requests of the harness, one answer, one interrupt, one new-session control, two
\* prompts, one death of the harness (the driver ends, and starts again), one session item shown
\* again unasked.
SPECIFICATION Spec
CONSTANTS
    Chats = {"c1"}
    Asks = {"a1", "a2"}
    Calls = {"k1"}
    Answers = {"r1"}
    Interrupts = {"r2"}
    NewSessions = {"r3"}
    MaxSessions = 5
    MaxPrompts = 2
    MaxDeaths = 1
    MaxEdits = 1
    PerChat = FALSE
    SelfResolves = TRUE
    Unshowable = FALSE
    StrayAsks = FALSE
    CallNamed = FALSE
    CancelOnInterrupt = FALSE
    ReaskAfterRestart = FALSE
    FairDriver = TRUE
    FairHarness = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S5 S11 S13
PROPERTIES L1 L2
