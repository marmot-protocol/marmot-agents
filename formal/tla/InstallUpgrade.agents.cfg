\* Fair, two Hermes agents in one home, each with a Hermes of its own: an older install of both, upgraded by an install of one; a run after a kill may be of either agent, or of Codex. Every property must hold.
\* Bounds: 1 run the person starts, 2 kills (SIGKILL) and 2 runs that fail or are stopped (TERM). InstallUpgrade.md says more.
SPECIFICATION Spec
CONSTANTS
    Harnesses = {"hermes", "codex"}
    Main = "hermes"
    Older = TRUE
    FirstRuns = 1
    Slots = {1}
    MaxKills = 2
    MaxFails = 2
    FairPerson = TRUE
    Agents = {"a", "b"}
    Bug = "none"
INVARIANTS TypeOK U1 U2 U3
PROPERTIES L1
