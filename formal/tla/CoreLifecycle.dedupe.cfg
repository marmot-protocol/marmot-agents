\* MDK keeps each send's token and never posts one twice: the lookup may still miss, as in
\* CoreLifecycle.duplicate.cfg, with a crash and an unknown outcome as well, and every property
\* holds. (A send is never given up here: one unknown outcome, two tries.)
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    MaxRefusals = 0
    UnknownTries = 2
    GoneChats = {}
    ExactLookup = FALSE
    TokenDedupe = TRUE
    LagCatchUp = FALSE
    LiveInOrder = TRUE
    LiveAfterStore = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
