\* Unfair: MDK may stop answering, sends and lookups alike. L1 must fail: a settle is never
\* posted. The trace is counterexamples/unfair-mdk-never-answers.trace.txt, and its schedule is
\* described in counterexamples/README.md.
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    Items = {"s1"}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 1
    UnknownTries = 2
    GoneChats = {}
    ExactLookup = TRUE
    TokenDedupe = FALSE
    LagCatchUp = FALSE
    LiveInOrder = TRUE
    FairMdk = FALSE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1
