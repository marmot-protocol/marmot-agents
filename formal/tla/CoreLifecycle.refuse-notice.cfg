\* MDK refuses one send to a live group for good, with no item, so the notice that settles r1 is
\* what is refused. Every property must hold: a failed notice settles r1 in its place, a last
\* resort (L1).
SPECIFICATION Spec
CONSTANTS
    Prompts = {"p1"}
    Requests = {"r1"}
    NewSession = {"r1"}
    Items = {}
    MaxDowns = 1
    MaxEmits = 2
    MaxAmbiguous = 0
    MaxRefusals = 1
    MaxRejected = 0
    RejectedTries = 2
    GoneChats = {}
    TokenDedupe = TRUE
    LagCatchUp = FALSE
    LiveInOrder = TRUE
    LiveAfterStore = TRUE
    LastResortTaken = TRUE
    FairMdk = TRUE
    FairDriver = TRUE
    FairTime = TRUE
    Bug = "none"
INVARIANTS TypeOK S1 S2 S3 S4 S10 S12
PROPERTIES L1 L2 L3 S3Told
