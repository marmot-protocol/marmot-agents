name: CI

# Four lanes across three tiers (D-169, replacing D-130). The same commands are in AGENTS.md under
# "Verification"; keep the two in step.
#
# - Fast Team PR gate (same-repo branch by a write/maintain/admin collaborator without `ci:full`,
#   ~45-60s, zero Rust compile): verified PR commit signatures, `tree-state` check (fails closed
#   when `red` unless labeled `tree-fix` or `revert`), hard-enforced D-162 commit trailers,
#   `cargo fmt --all --check`, ShellCheck, Recordings, TypeScript, Python, and Documents.
# - External / fork PR gate (or a Team PR labeled `ci:full`): full Rust Clippy, workspace tests
#   with conformance + property + fuzz-seed checks, Simulator, socket conformance, Install scripts,
#   and TLA+ models (trailers remain advisory on external PRs; GitHub already ensures only
#   collaborators with write access can merge external PRs).
# - Hourly canary (`canary.yml`, D-163, #222) calls this workflow via `workflow_call` with
#   `tier: full` and `save_caches: true` whenever `master` moves past `canary`: it runs the full
#   gate (simulator at 200 runs, Docker move-over tests, Kani proofs, and all TLA+ models),
#   refreshes `master`'s Rust build caches once per batch, and fast-forwards `canary` on green.
#   The revert-only bisect agent (D-168) watches canary and isolates regressions or activates
#   Meltdown Mode (`tree-state=red`).
# - Pushes to master do not trigger CI (D-161). `workflow_dispatch` runs either tier on any branch
#   and refreshes that branch's caches (pick `tier: full` on `master` to also refresh `rust-kani`).
#
# The job `CI passed` needs every other job and is the one check a ruleset requires: a job that
# failed or was cancelled fails it, and so does a job its tier expects that did not run and pass,
# which it finds by listing the run's jobs (tools/ci/passed.py). A job its tier or the path rule
# left out counts as passed.
# `workflow_dispatch` runs either tier on any branch, to try this file before a pull request.
# The long checks are in nightly.yml.
#
# Rules for this file: every action is pinned to a commit and every downloaded tool to a version
# and a checksum, the token can only read, and no job uses a secret. No job sets RUSTFLAGS: that
# would replace the ban on unsafe code in .cargo/config.toml.
on:
  pull_request:
  workflow_call:
    inputs:
      tier:
        description: The pull-request tier, or the full gate
        type: string
        default: full
      save_caches:
        description: Whether Rust jobs should save build caches on miss
        type: boolean
        default: false
      job_prefix:
        description: Caller job prefix GitHub prepends to called job names (for passed.py)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tier:
        description: The pull-request tier, or the full gate
        type: choice
        options:
          - pull-request
          - full
        default: pull-request

permissions:
  contents: read

concurrency:
  # Inside workflow_call, github.event_name is the caller's event (schedule or workflow_dispatch),
  # so key on inputs.job_prefix rather than github.event_name.
  group: ci-${{ inputs.job_prefix != '' && format('call-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A build in CI is built once: incremental artifacts would only make the caches larger. Line
  # tables keep file and line in a test's backtrace and make the debug build and its cache a
  # fraction of the size. Neither changes what is tested.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Tier and changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fast: ${{ steps.tier.outputs.fast }}
      full: ${{ steps.tier.outputs.full }}
      models: ${{ steps.tier.outputs.models }}
      is_team_pr: ${{ steps.trust.outputs.is_team_pr }}
    steps:
      - name: Verify PR commit signatures
        # Runs before any PR code is checked out. Fails closed if any commit in the PR lacks a
        # GitHub-verified signature (complementing the master ruleset's required_signatures rule).
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" |
            jq -s --exit-status --arg head "${HEAD_SHA}" --argjson expected "${COMMIT_COUNT}" '
              [.[][]] as $commits |
              $expected > 0 and ($commits | length) == $expected and
              ([$commits[].sha] | unique | length) == $expected and
              any($commits[]; .sha == $head) and
              all($commits[]; .commit.verification.verified == true)'

      - name: Classify PR trust and live labels
        # Only same-repo PRs authored by a collaborator with write, maintain, or admin permission
        # qualify for the fast static Team PR gate. External/fork PRs, read-only members, and
        # failed permission lookups all fail closed into the full PR suite. Labels are read live
        # so applying `ci:full`, `tree-fix`, or `revert` and re-running takes effect immediately.
        id: trust
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          is_team_pr=false
          has_ci_full=false
          has_tree_override=false
          if [ "${EVENT}" = pull_request ]; then
            labels_json="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" | jq -s '[.[][].name]')"
            if jq -e 'index("ci:full") != null' <<< "${labels_json}" > /dev/null; then
              has_ci_full=true
            fi
            if jq -e 'any(. == "tree-fix" or . == "revert")' <<< "${labels_json}" > /dev/null; then
              has_tree_override=true
            fi
            if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" = "${REPO}" ] && [ "${HEAD_FORK}" != "true" ] && [ -n "${PR_AUTHOR}" ]; then
              permission="$(gh api "repos/${REPO}/collaborators/${PR_AUTHOR}/permission" --jq '.permission // ""' 2>/dev/null || true)"
              case "${permission}" in
                write|maintain|admin) is_team_pr=true ;;
              esac
            fi
          fi
          echo "is_team_pr=${is_team_pr}" >> "${GITHUB_OUTPUT}"
          echo "has_ci_full=${has_ci_full}" >> "${GITHUB_OUTPUT}"
          echo "has_tree_override=${has_tree_override}" >> "${GITHUB_OUTPUT}"
          echo "Team PR: ${is_team_pr}. ci:full: ${has_ci_full}. tree-override: ${has_tree_override}."

      - name: Check tree-state gate
        # Fails closed when origin/tree-state:state.json is not "green" (Meltdown Mode, D-168)
        # unless the recovery PR carries the `tree-fix` or `revert` label (merging still requires
        # write access). Applies to every PR run started or re-run while tree-state is red.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_TREE_OVERRIDE: ${{ steps.trust.outputs.has_tree_override }}
        run: |
          set -euo pipefail
          raw="$(gh api "repos/${REPO}/contents/state.json?ref=tree-state" --jq '.content' | tr -d '\n' | base64 -d)"
          tree_state="$(jq -r '.state // "unknown"' <<< "${raw}")"
          reason="$(jq -r '.reason // ""' <<< "${raw}")"
          echo "tree-state: ${tree_state} (${reason})"
          if [ "${tree_state}" != "green" ]; then
            has_tree_override="${HAS_TREE_OVERRIDE}"
            if [ "${has_tree_override}" != "true" ]; then
              # `gh pr create --label` (and two-step PR creation) attaches labels in a follow-up
              # API call after opening the PR; briefly re-check live labels before failing closed.
              for delay in 2 4 6; do
                sleep "${delay}"
                if labels_json="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" | jq -s '[.[][].name]')"; then
                  if jq -e 'any(. == "tree-fix" or . == "revert")' <<< "${labels_json}" > /dev/null; then
                    has_tree_override=true
                    break
                  fi
                fi
              done
            fi
            if [ "${has_tree_override}" = "true" ]; then
              echo "::notice::tree-state is '${tree_state}', allowed via tree-fix/revert label."
            else
              echo "::error::master is frozen in Meltdown Mode (tree-state=${tree_state}: ${reason}). Label recovery PRs 'tree-fix' or 'revert' to pass CI while red."
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's commit here is its merge into the base branch, whose first parent is
          # the base: the two are all the diff needs.
          fetch-depth: 2

      - name: Choose the tier, and whether the models run
        # The models follow code: CoreLifecycle and ActivityHoldBack the core (formal/tla/README.md,
        # ActivityHoldBack.md), SocketProtocol the core's socket and the three connectors on it
        # (SocketProtocol.md), DriverTransport the built-in drivers (DriverTransport.md),
        # InstallUpgrade the install scripts (InstallUpgrade.md). So they run when that code, the
        # models or their tools change, or this file. Anything that cannot tell runs them.
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ inputs.tier }}
          IS_TEAM_PR: ${{ steps.trust.outputs.is_team_pr }}
          HAS_CI_FULL: ${{ steps.trust.outputs.has_ci_full }}
        run: |
          set -euo pipefail
          fast=false
          full=false
          models=true
          if [ -n "${TIER}" ]; then
            [ "${TIER}" = full ] && full=true
          elif [ "${EVENT}" = pull_request ]; then
            if [ "${HAS_CI_FULL}" = true ]; then
              full=true
            elif [ "${IS_TEAM_PR}" = true ]; then
              fast=true
              models=false
            fi
          else
            full=true
          fi
          if [ "${fast}" = false ] && [ "${full}" = false ] && [ "${EVENT}" = pull_request ]; then
            # --no-renames: a file moved out of a watched path counts there as deleted. git exits
            # 0 when nothing there changed and 1 when something did; anything else is an error,
            # and the models run.
            echo "Changed files:"
            git diff --name-only --no-renames HEAD^1 HEAD || true
            status=0
            git diff --quiet --no-renames HEAD^1 HEAD -- \
              formal/ tools/tla/ .github/workflows/ci.yml \
              crates/marmot-agent/src/ \
              packages/claude-code/src/ packages/openclaw/src/ python/marmot_hermes/ \
              crates/marmot-agent-driver/src/ crates/marmot-agent-codex/src/ \
              crates/marmot-agent-acp/src/ crates/marmot-agent-pi/src/ install/ || status=$?
            case "${status}" in
              0) models=false ;;
              1) ;;
              *) echo "::warning::git could not compare the paths the models follow, so the models run." ;;
            esac
          fi
          echo "fast=${fast}" >> "${GITHUB_OUTPUT}"
          echo "full=${full}" >> "${GITHUB_OUTPUT}"
          echo "models=${models}" >> "${GITHUB_OUTPUT}"
          echo "Fast Team PR: ${fast}. Full gate: ${full}. Models: ${models}."

      - name: PR commit trailers
        # Hard-enforced on Team PRs (D-162, D-169); advisory on external/fork PRs so outside
        # contributors are not blocked by internal agent trailer conventions.
        if: github.event_name == 'pull_request'
        env:
          IS_TEAM_PR: ${{ steps.trust.outputs.is_team_pr }}
        run: |
          set -euo pipefail
          if [ "${IS_TEAM_PR}" = true ]; then
            python3 tools/ci/check_pr_trailers.py --base HEAD^1 --head HEAD^2
          else
            python3 tools/ci/check_pr_trailers.py --base HEAD^1 --head HEAD^2 --advisory \
              || echo "::warning title=PR trailers::advisory check failed unexpectedly"
          fi

  rust-fmt:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format
        # Install only the pinned channel + rustfmt (skipping clippy and llvm-tools-preview) so
        # formatting finishes in seconds without compiling anything.
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          rustup toolchain install "${channel}" --profile minimal --component rustfmt --no-self-update
          cargo +"${channel}" fmt --version
          cargo +"${channel}" fmt --all --check

  lint:
    name: Rust format and Clippy
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    # Without a cache (after Cargo.lock or the compiler changes) Clippy takes about 4 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust
        with:
          cache: rust-lint
          skip_fallback: ${{ inputs.save_caches == true && 'true' || 'false' }}

      - name: Format
        # `cargo fmt` builds nothing and has no --locked.
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - if: (github.event_name == 'workflow_dispatch' || inputs.save_caches == true) && steps.rust.outputs.hit != 'true'
        uses: ./.github/actions/rust
        with:
          cache: rust-lint
          save: "true"
          key: ${{ steps.rust.outputs.key }}

  tests:
    name: Rust tests (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    # Cargo runs one test program at a time, and the core's take about three minutes, so the
    # workspace's tests run in two jobs side by side: the core's package, and every other but the
    # simulator's, which runs in release in its own job. The conformance suite
    # (crates/marmot-agent-conformance) is in the second, in about 30 s; its Pi tests need the
    # runner's python3. The core's run the real Claude Code and Codex on the model double
    # (tools/model_double), with no key, in about 30 s. The property tests run in both at
    # proptest's normal count, 256 cases each (the core's in about a minute, the translators' in
    # the conformance suite's package in about 20 s), and the second runs every fuzz target's
    # check over its seeds (crates/marmot-agent-fuzz), on this compiler; the nightly run raises
    # the count and fuzzes (D-144). Without a cache the build takes about 5 minutes more.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            slug: core
            packages: -p marmot-agent
            cache: rust-test-core
          - part: drivers and the rest
            slug: drivers-and-the-rest
            packages: --workspace --exclude marmot-agent --exclude marmot-agent-sim
            cache: rust-test-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust
        with:
          cache: ${{ matrix.cache }}
          skip_fallback: ${{ inputs.save_caches == true && 'true' || 'false' }}

      - uses: ./.github/actions/nextest

      - if: matrix.part == 'core'
        uses: ./.github/actions/harnesses

      - name: Build the tests
        run: cargo nextest run --locked --all-features ${{ matrix.packages }} --no-run

      - name: Tests
        run: |
          cargo nextest run --locked --all-features --profile ci ${{ matrix.packages }}
          cargo test --doc --locked --all-features ${{ matrix.packages }}

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-rust-tests-${{ matrix.slug }}-attempt-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - if: (github.event_name == 'workflow_dispatch' || inputs.save_caches == true) && steps.rust.outputs.hit != 'true'
        uses: ./.github/actions/rust
        with:
          cache: ${{ matrix.cache }}
          save: "true"
          key: ${{ steps.rust.outputs.key }}

  simulator:
    name: Simulator
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    # In release, with the build cached: with the dependencies cached, the build takes about
    # 30 s and 200 runs of each gate family about 10 s; without a cache the build takes about 7
    # minutes on a runner. A pull request runs the normal count (20 of each family); the full
    # gate runs 200. Many more seeds are for the nightly run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust
        with:
          cache: rust-simulator
          skip_fallback: ${{ inputs.save_caches == true && 'true' || 'false' }}

      - uses: ./.github/actions/nextest

      - name: Build the simulator's tests
        run: cargo nextest run --locked --release -p marmot-agent-sim --all-features --no-run

      - name: The simulator's tests, with the seeds
        # Each family of the gate runs this many schedules from seed 0; the bug switches and the
        # faults made by hand are each found, and a capsule replays exactly. A run that hangs is
        # killed after 4 minutes, as an ordinary failure, and the step below still keeps what it
        # left; the job's own limit would cancel the job instead.
        env:
          MARMOT_AGENT_SIM_RUNS: ${{ needs.changes.outputs.full == 'true' && '200' || '20' }}
        run: timeout --kill-after=30s 4m cargo nextest run --locked --release -p marmot-agent-sim --all-features --profile ci

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-simulator-attempt-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the schedules and capsules of a failed run
        # Each failure leaves a capsule that replays it (crates/marmot-agent-sim/README.md); a run
        # that hung or panicked leaves its schedule.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-capsules
          path: target/tmp/marmot-agent-sim/
          if-no-files-found: ignore
          retention-days: 14

      - if: (github.event_name == 'workflow_dispatch' || inputs.save_caches == true) && steps.rust.outputs.hit != 'true'
        uses: ./.github/actions/rust
        with:
          cache: rust-simulator
          save: "true"
          key: ${{ steps.rust.outputs.key }}

  move-over:
    name: Move-over tests (Docker)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # The full gate only. Today's Hermes and OpenClaw installs, each in the repository's gateway
    # image with a scripted model the test serves on the loopback address: no key, no sign-in,
    # nothing beyond the runner but the images' downloads (crates/marmot-agent/tests/
    # import_gateways.rs). The other move-over tests need no Docker and run in the core's tests.
    # The socket conformance tests run in their own job. Every other ignored test needs a model key
    # or a signed-in harness, which CI does not have.
    timeout-minutes: 45
    env:
      # The package that holds the move-over tests. When they move to a crate of their own, this
      # line is the one to change.
      MOVE_OVER_PACKAGE: marmot-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          # The core's tests build the same dependencies; this job reads their cache and saves
          # none of its own.
          cache: rust-test-core

      # install/openclaw.sh needs Node 24 on the machine, and the runner has an older one.
      - uses: ./.github/actions/node

      - uses: ./.github/actions/nextest

      - name: Build the tests
        run: cargo nextest run --locked --all-features -p "${MOVE_OVER_PACKAGE}" --test import_gateways --no-run

      - name: Hermes and OpenClaw installs move over
        # One scenario at a time: the gateways share the runner's network.
        run: >
          cargo nextest run --locked --all-features --profile ci -p "${MOVE_OVER_PACKAGE}"
          --test import_gateways --run-ignored ignored-only --test-threads 1 --no-capture

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-move-over-tests-docker-attempt-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  conformance-socket:
    name: Conformance (socket)
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    # The shipped socket connectors, Claude Code, Hermes and OpenClaw, through the driver conformance
    # suite on the core's real socket, each with a scripted harness inside it: no key and no network
    # (crates/marmot-agent/tests/conformance_socket.rs). They need Node and Python, so the test is
    # ignored in the core's tests and runs here. About a minute once built.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          # The core's tests build the same dependencies; this job reads their cache and saves
          # none of its own.
          cache: rust-test-core

      - uses: ./.github/actions/nextest

      - uses: ./.github/actions/node

      - uses: ./.github/actions/python

      - name: Install the two packages package-lock.json names
        run: |
          npm ci --prefix packages/claude-code
          npm ci --prefix packages/openclaw

      - name: Build the test
        run: cargo nextest run --locked --all-features -p marmot-agent --test conformance_socket --no-run

      - name: Each connector runs the conformance scenarios over the socket
        run: cargo nextest run --locked --all-features --profile ci -p marmot-agent --test conformance_socket --run-ignored ignored-only

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-conformance-socket-attempt-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  kani:
    name: Kani proofs
    needs: changes
    # The full gate only: Kani builds the core, with MDK, with its own compiler before it proves
    # anything, which takes longer than a pull request may. Its proofs are of small pure functions,
    # each over every input up to a bound stated with it (docs/design/verification.md, "5. Bounded
    # proofs with Kani"); `cargo kani -p marmot-agent` runs them all. Kani brings its own nightly
    # compiler, which `cargo kani setup` installs; everything else builds with the workspace's.
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KANI_VERSION: 0.68.0
      # The `digest` of kani-<version>-x86_64-unknown-linux-gnu.tar.gz on Kani's release page.
      # Change the version and the checksum together.
      KANI_BUNDLE_SHA256: 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust
        with:
          cache: rust-kani
          skip_fallback: ${{ inputs.save_caches == true && 'true' || 'false' }}

      - name: Install Kani
        # The driver from crates.io at this version, with its own lock file; the bundle it runs,
        # CBMC and Kani's compiler, from the release page, checked against its checksum.
        run: |
          set -euo pipefail
          cargo install --locked kani-verifier --version "${KANI_VERSION}"
          name="kani-${KANI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/model-checking/kani/releases/download/kani-${KANI_VERSION}/${name}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}" "${url}"
          echo "${KANI_BUNDLE_SHA256}  ${RUNNER_TEMP}/${name}" | sha256sum --check
          cargo kani setup --use-local-bundle "${RUNNER_TEMP}/${name}"
          rm "${RUNNER_TEMP}/${name}"
          cargo kani --version

      - name: Every proof holds
        run: cargo kani -p marmot-agent --output-format terse

      - if: (github.event_name == 'workflow_dispatch' || inputs.save_caches == true) && steps.rust.outputs.hit != 'true'
        uses: ./.github/actions/rust
        with:
          cache: rust-kani
          save: "true"
          key: ${{ steps.rust.outputs.key }}

  recordings:
    name: Recordings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The prototype handles what no recording holds
        run: python3 tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/prototype.xml" -s tools/prototype -p 'test_*.py'

      - name: The scrubber and the gateway recorders write nothing that failed
        run: python3 tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/record.xml" -s tools/record -p 'test_*.py'

      - name: The model double reads and writes each wire format
        run: python3 tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/model-double.xml" -s tools/model_double -p 'test_*.py'

      # A report, not a check (D-127): a cassette older than 14 days is a warning here. It fails only
      # the nightly run, which runs the same script with --strict (nightly.yml).
      # A folder that is not there fails this step (exit 2), hence pipefail.
      - name: Report the model double's cassettes that are due to be recorded again
        run: |
          set -o pipefail
          python3 tools/model_double/check_cassettes.py fixtures/cassettes --offline |
            while IFS= read -r line; do echo "::warning title=Cassette due::$line"; done

      - name: Every native message has a rule in the prototype
        run: >
          python3 tools/prototype/translate.py --check
          fixtures/recordings/codex fixtures/recordings/claude
          fixtures/recordings/hermes fixtures/recordings/openclaw
          fixtures/recordings/acp/opencode fixtures/recordings/acp/goose fixtures/recordings/acp/cursor fixtures/recordings/acp/antigravity
          fixtures/recordings/pi

      - name: The Codex driver's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/codex --check

      - name: The Claude Code driver's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/claude --check

      - name: The ACP driver's expected events are what the prototype writes
        run: |
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/opencode --check
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/goose --check
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/cursor --check
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/antigravity --check

      - name: The Pi driver's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/pi --check

      - name: The OpenClaw plugin's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/openclaw --check

      - name: The Hermes plugin's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/hermes --check

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-recordings-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14

  typescript:
    name: TypeScript (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [claude-code, openclaw]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node

      - name: Install the packages package-lock.json names
        run: npm ci

      - name: Types
        run: npm run check

      - name: The translator replays every recording, and the transport runs against fakes
        run: |
          mkdir -p "${RUNNER_TEMP}/junit"
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="${RUNNER_TEMP}/junit/typescript.xml" \
            "test/*.test.ts"

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-typescript-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: ./.github/actions/python

      - name: The Hermes plugin replays every recording, and its transport runs against fakes
        run: |
          python3 --version
          python3 ../tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/hermes.xml" -s tests

      - name: Track versions and socket protocol compatibility
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = pull_request ]; then
            python3 tools/ci/check_socket_compat.py --base HEAD^1
          else
            python3 tools/ci/check_socket_compat.py
          fi

      - name: Release planner tests
        working-directory: .
        run: python3 tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/release.xml" -s tools/release -p 'test_*.py'

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-python-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        # To move to another release, change the version and the checksum together: the checksum is
        # the `digest` of this file on the release page.
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          name="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${name}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}" "${url}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${name}" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/${name}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: The shell scripts pass ShellCheck
        run: |
          shellcheck --version
          shellcheck -x install/*.sh tools/release/archive.sh tools/release/package.sh tools/release/package_connector.sh tools/tla/run.sh

  install:
    name: Install scripts
    needs: changes
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    # Runs in the full / external / canary gates (fast Team PRs run `ShellCheck` above).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Each install script runs against a throwaway home, with stand-ins for what it calls
        # Each test named as it runs, so a run cut short says where, and the ten slowest at the end.
        run: python3 tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/install.xml" -v --durations 10 -s install -p 'test_*.py'

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-install-scripts-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14

  models:
    name: TLA+ models (${{ matrix.part }})
    needs: changes
    # On a pull request, only when the code a model follows or the models changed; always in the
    # full gate.
    if: needs.changes.outputs.models == 'true'
    runs-on: ubuntu-24.04
    # The small bounds, in six jobs side by side: CoreLifecycle's fair configuration, its give-up
    # configuration, which takes as long, and its other cases, each about 4 minutes, the cases
    # of SocketProtocol and of DriverTransport, and those of the two small models, InstallUpgrade
    # and ActivityHoldBack, about a minute together. The larger bounds are in nightly.yml.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: fair
            cases: --model CoreLifecycle --only fair
          - part: give-up
            cases: --model CoreLifecycle --only give-up-closes-item
          - part: the other cases
            cases: --model CoreLifecycle --except fair give-up-closes-item
          - part: SocketProtocol
            cases: --model SocketProtocol
          - part: DriverTransport
            cases: --model DriverTransport
          - part: InstallUpgrade and ActivityHoldBack
            cases: --model InstallUpgrade ActivityHoldBack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the TLC jar
        # Keyed by the checksum tools/tla/run.sh pins, which checks the jar again on every run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/marmot-agents/tla
          key: tla2tools-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

      - name: The fair models pass, and every counterexample, defect and probe fails as stated
        env:
          TLC_WORKERS: "4"
        run: python3 tools/tla/check.py ${{ matrix.cases }}

  documents:
    name: Documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        # A link checker. It is a tool that CI runs, not a dependency of the code. To move to
        # another release, change the version and the checksum together: the checksum is the
        # `digest` of this file on the release page.
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
        run: |
          set -euo pipefail
          name=lychee-x86_64-unknown-linux-musl
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${name}.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}.tar.gz" "${url}"
          echo "${LYCHEE_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"

      - name: Links and anchors in the Markdown files
        # The settings are in lychee.toml.
        run: |
          lychee --version
          lychee .

  passed:
    # The one check the master ruleset requires on pull requests, and the gate hourly canary checks
    # before fast-forwarding `canary`. It runs
    # whatever happened above (`always()`: a required check that is skipped would count as
    # passed). It fails if any job failed or was cancelled, and, since GitHub can report a matrix
    # job as passed when a leg was cancelled before a runner took it, it also lists the run's jobs
    # and fails unless every job the tier expects ran and passed (tools/ci/passed.py). A job its
    # tier or the path rule left out may be skipped. A new job, or a new leg of a matrix, must be
    # added to `needs` and to EXPECTED below, under the name the run shows.
    name: CI passed
    if: always()
    needs:
      - changes
      - rust-fmt
      - lint
      - tests
      - simulator
      - move-over
      - conformance-socket
      - kani
      - recordings
      - typescript
      - python
      - shellcheck
      - install
      - models
      - documents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # To list this run's jobs. Read only.
      actions: read
    steps:
      - name: Every job passed, or was left out by the tier or the path rule
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          FAST: ${{ needs.changes.outputs.fast }}
          IS_TEAM_PR: ${{ needs.changes.outputs.is_team_pr }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "${NEEDS}" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
          if [ "${EVENT}" = pull_request ] && [ "${IS_TEAM_PR}" != true ] && [ "${FAST}" = true ]; then
            echo "::error::Non-team PR must not take the fast gate."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The flake report's tests read the workflows' job names (D-143), and
          # test_check_socket_compat.py reads the socket schema and per-track manifests (D-165).
          sparse-checkout: |
            tools/ci
            .github/workflows
            fixtures/socket
            crates/marmot-agent/src
            packages/claude-code
            packages/openclaw
            python

      - name: The gate's own check passes its tests
        run: python3 tools/ci/unittest_junit.py --junit "${RUNNER_TEMP}/junit/ci-tools.xml" -s tools/ci -p 'test_*.py'

      - name: Upload JUnit test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-ci-passed-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Every job the tier expects ran and passed
        # `[fast]`: fast Team PR gate only. `[slow]`: non-fast runs (external PR, ci:full, dispatch,
        # canary). `[full]`: full gate only. `[models]`: when TLA+ models run.
        env:
          GH_TOKEN: ${{ github.token }}
          FAST: ${{ needs.changes.outputs.fast }}
          FULL: ${{ needs.changes.outputs.full }}
          MODELS: ${{ needs.changes.outputs.models }}
          JOB_PREFIX: ${{ inputs.job_prefix }}
          EXPECTED: |
            Tier and changed paths
            Rust format [fast]
            Rust format and Clippy [slow]
            Rust tests (core) [slow]
            Rust tests (drivers and the rest) [slow]
            Simulator [slow]
            Move-over tests (Docker) [full]
            Conformance (socket) [slow]
            Kani proofs [full]
            Recordings
            TypeScript (claude-code)
            TypeScript (openclaw)
            Python
            ShellCheck
            Install scripts [slow]
            TLA+ models (fair) [models]
            TLA+ models (give-up) [models]
            TLA+ models (the other cases) [models]
            TLA+ models (SocketProtocol) [models]
            TLA+ models (DriverTransport) [models]
            TLA+ models (InstallUpgrade and ActivityHoldBack) [models]
            Documents
        run: |
          set -euo pipefail
          gh api --paginate --jq '.jobs[] | {name, status, conclusion}' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${RUNNER_TEMP}/jobs.jsonl"
          python3 tools/ci/passed.py \
            --jobs "${RUNNER_TEMP}/jobs.jsonl" \
            --fast "${FAST}" \
            --full "${FULL}" \
            --models "${MODELS}" \
            --prefix "${JOB_PREFIX}"
