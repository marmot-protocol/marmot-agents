name: CI

# Every pull request, and every push to master. The same commands are in AGENTS.md under
# "Verification"; keep the two in step.
#
# Rules for this file: every action is pinned to a commit and every downloaded tool to a version
# and a checksum, the token can only read, and no job uses a secret. No job sets RUSTFLAGS: that
# would replace the ban on unsafe code in .cargo/config.toml.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    # MDK, which the core links, takes most of this to build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Odin
        # MDK's markdown parser is written in Odin and its build needs this exact release. The
        # script pins it by version, commit and checksum.
        run: |
          bash tools/odin/install.sh "${RUNNER_TEMP}/odin"
          echo "ODIN=${RUNNER_TEMP}/odin/odin" >> "${GITHUB_ENV}"

      - name: Install the pinned toolchain
        # With no arguments this installs what rust-toolchain.toml names.
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Format
        # `cargo fmt` builds nothing and has no --locked.
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Install Node and the Claude Code driver's packages
        # The Claude Code scenario on the model double (crates/marmot-agent/tests/claude.rs) runs
        # the real driver and the Claude Code its SDK ships. The same Node as the TypeScript job:
        # change the two together.
        env:
          NODE_VERSION: 24.22.3
          NODE_SHA256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
        run: |
          set -euo pipefail
          name="node-v${NODE_VERSION}-linux-x64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/${name}.tar.xz"
          echo "${NODE_SHA256}  ${RUNNER_TEMP}/${name}.tar.xz" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/${name}.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}/bin" >> "${GITHUB_PATH}"
          PATH="${RUNNER_TEMP}/${name}/bin:${PATH}" npm ci --prefix packages/claude-code

      - name: Install Codex
        # The Codex scenario on the model double (crates/marmot-agent/tests/codex.rs) runs the real
        # `codex app-server`. To move to another release, change the version and the checksum
        # together: the checksum is the sha256 of the release's
        # codex-x86_64-unknown-linux-musl.tar.gz. Codex runs commands in bubblewrap, which needs the
        # user namespaces Ubuntu 24.04 keeps from unprivileged programs unless this is switched off.
        env:
          CODEX_VERSION: 0.171.0
          CODEX_SHA256: 01baa2e47809f8597be5b2f8abd4e4dfe3fb5bcb6e504c2fbaaad97056c15e8d
        run: |
          set -euo pipefail
          name="codex-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/${name}.tar.gz"
          echo "${CODEX_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/codex"
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}/codex"
          mv "${RUNNER_TEMP}/codex/${name}" "${RUNNER_TEMP}/codex/codex"
          echo "${RUNNER_TEMP}/codex" >> "${GITHUB_PATH}"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tests
        # The simulator's tests run in the Simulator job, in release, so they are not run twice. The
        # driver conformance suite (crates/marmot-agent-conformance) runs here, in about 30 s; its Pi
        # tests need the runner's python3. The Claude Code and Codex scenarios run the real
        # harnesses on the model double (tools/model_double), with no key, in about 30 s.
        run: cargo test --locked --workspace --all-features --exclude marmot-agent-sim

  simulator:
    name: Simulator
    runs-on: ubuntu-24.04
    # Within the pull-request budget (D-094). Beside the Rust job, in release, with the build
    # cached. Measured with 4 jobs on 2026-11-22: with the dependencies cached, building the
    # workspace's crates and running every test took 35 s (the runs about 10 s), so the job should
    # take about 5 minutes with its setup; with no cache (after Cargo.lock or the compiler
    # changes) the build alone took 6 min 44 s, so expect 10 to 14 on a runner. More seeds are for
    # a nightly run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Odin
        run: |
          bash tools/odin/install.sh "${RUNNER_TEMP}/odin"
          echo "ODIN=${RUNNER_TEMP}/odin/odin" >> "${GITHUB_ENV}"

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache the build
        # Keyed by Cargo.lock, the toolchain and this job; a pull request reads master's cache.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the simulator's tests
        run: cargo test --locked --release -p marmot-agent-sim --all-features --no-run

      - name: The simulator's tests, with the seeds
        # Each family of the gate runs this many schedules from seed 0; the bug switches and the
        # faults made by hand are each found, and a capsule replays exactly. They take about 10 s
        # once built, so a run that hangs is killed after 4 minutes, as an ordinary failure, and
        # the step below still keeps what it left; the job's own limit would cancel the job
        # instead.
        env:
          MARMOT_AGENT_SIM_RUNS: "200"
        run: timeout --kill-after=30s 4m cargo test --locked --release -p marmot-agent-sim --all-features

      - name: Keep the schedules and capsules of a failed run
        # Each failure leaves a capsule that replays it (crates/marmot-agent-sim/README.md); a run
        # that hung or panicked leaves its schedule.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-capsules
          path: target/tmp/marmot-agent-sim/
          if-no-files-found: ignore
          retention-days: 14

  recordings:
    name: Recordings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The prototype handles what no recording holds
        run: python3 -m unittest discover -s tools/prototype -p 'test_*.py'

      - name: The model double reads and writes each wire format
        run: python3 -m unittest discover -s tools/model_double -p 'test_*.py'

      # A report, not a check (D-127): a cassette older than 14 days is a warning here. It is to fail
      # only the nightly run, which will run the same script with --strict once that workflow exists.
      # A folder that is not there fails this step (exit 2), hence pipefail.
      - name: Report the model double's cassettes that are due to be recorded again
        run: |
          set -o pipefail
          python3 tools/model_double/check_cassettes.py fixtures/cassettes --offline |
            while IFS= read -r line; do echo "::warning title=Cassette due::$line"; done

      - name: Every native message has a rule in the prototype
        run: >
          python3 tools/prototype/translate.py --check
          fixtures/recordings/codex fixtures/recordings/claude
          fixtures/recordings/hermes fixtures/recordings/openclaw
          fixtures/recordings/acp/opencode fixtures/recordings/acp/goose fixtures/recordings/acp/cursor
          fixtures/recordings/pi

      - name: The Codex driver's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/codex --check

      - name: The Claude Code driver's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/claude --check

      - name: The ACP driver's expected events are what the prototype writes
        run: |
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/opencode --check
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/goose --check
          python3 tools/prototype/translate.py --expected fixtures/recordings/acp/cursor --check

      - name: The Pi driver's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/pi --check

      - name: The OpenClaw plugin's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/openclaw --check

      - name: The Hermes plugin's expected events are what the prototype writes
        run: python3 tools/prototype/translate.py --expected fixtures/recordings/hermes --check

  typescript:
    name: TypeScript (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [claude-code, openclaw]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        # To move to another release, change the version and the checksum together: the checksum
        # is this file's line in the release's SHASUMS256.txt. The packages are then checked
        # against package-lock.json by `npm ci`.
        working-directory: .
        env:
          NODE_VERSION: 24.22.3
          NODE_SHA256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
        run: |
          set -euo pipefail
          name="node-v${NODE_VERSION}-linux-x64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/${name}.tar.xz"
          echo "${NODE_SHA256}  ${RUNNER_TEMP}/${name}.tar.xz" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/${name}.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}/bin" >> "${GITHUB_PATH}"

      - name: Install the packages package-lock.json names
        run: npm ci

      - name: Types
        run: npm run check

      - name: The translator replays every recording, and the transport runs against fakes
        run: npm test

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        # The release Hermes runs on (python/.python-version), as a standalone build. To move to another
        # release, change the version, the build and the checksum together: the checksum is the `digest`
        # of this file on the release page of astral-sh/python-build-standalone. The Hermes plugin uses
        # the standard library only, so nothing else is installed.
        working-directory: .
        env:
          PYTHON_VERSION: 3.14.10
          PYTHON_BUILD: "20261026"
          PYTHON_SHA256: 1b38024924eb7f4cf0cab45d7b871d1f1991354190fccd2625ac7529a43786e2
        run: |
          set -euo pipefail
          [ "$(cat python/.python-version)" = "${PYTHON_VERSION}" ]
          name="cpython-${PYTHON_VERSION}%2B${PYTHON_BUILD}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_BUILD}/${name}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/python.tar.gz" "${url}"
          echo "${PYTHON_SHA256}  ${RUNNER_TEMP}/python.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/python.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/python/bin" >> "${GITHUB_PATH}"

      - name: The Hermes plugin replays every recording, and its transport runs against fakes
        run: |
          python3 --version
          python3 -m unittest discover -s tests

  install:
    name: Install scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        # To move to another release, change the version and the checksum together: the checksum is
        # the `digest` of this file on the release page.
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          name="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${name}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}" "${url}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${name}" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/${name}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: The install scripts pass ShellCheck
        run: |
          shellcheck --version
          shellcheck -x install/*.sh tools/release/package.sh tools/tla/run.sh

      - name: Each install script runs against a throwaway home, with stand-ins for what it calls
        run: python3 -m unittest discover -s install -p 'test_*.py'

  models:
    name: TLA+ models (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # D-094: pull requests stay under 15 minutes. These are the small bounds; larger ones are
    # for the nightly workflow. The fair model alone takes most of that, so it runs beside the
    # other cases rather than before them.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: fair
            cases: --model CoreLifecycle --only fair
          - part: the other cases
            cases: --model CoreLifecycle --except fair
          - part: SocketProtocol
            cases: --model SocketProtocol
          - part: DriverTransport
            cases: --model DriverTransport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the TLC jar
        # Keyed by the checksum tools/tla/run.sh pins, which checks the jar again on every run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/marmot-agents/tla
          key: tla2tools-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

      - name: The fair models pass, and every counterexample, defect and probe fails as stated
        env:
          TLC_WORKERS: "4"
        run: python3 tools/tla/check.py ${{ matrix.cases }}

  documents:
    name: Documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        # A link checker. It is a tool that CI runs, not a dependency of the code. To move to
        # another release, change the version and the checksum together: the checksum is the
        # `digest` of this file on the release page.
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
        run: |
          set -euo pipefail
          name=lychee-x86_64-unknown-linux-musl
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${name}.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${name}.tar.gz" "${url}"
          echo "${LYCHEE_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"

      - name: Links and anchors in the Markdown files
        # The settings are in lychee.toml.
        run: |
          lychee --version
          lychee .
