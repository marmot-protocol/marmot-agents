name: Canary

# Hourly full-gate verification of master (D-163, #222): skips immediately when master has not
# moved past the protected `canary` branch (or when the same SHA has already failed canary twice
# without force=true); otherwise runs the full ci.yml gate (including the simulator at 200 runs,
# Docker move-over tests, Kani proofs, and all TLA+ models), refreshes master's Rust build caches
# once per batch, and fast-forwards `canary` to the exact verified SHA. On failure, opens or
# comments on one tracking issue so a red master is never silent.
#
# Rules for this file, as for ci.yml: every action is pinned to a commit, no secret is used beyond
# GITHUB_TOKEN, and only the final `advance` / `report` jobs (which check out and run no repository
# code) hold write permissions.
on:
  schedule:
    # Hourly at :07 past the hour (off :00 to avoid top-of-hour runner queues).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if master is at canary or already failed twice on this SHA
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  check:
    name: Check whether master moved
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
      should_advance: ${{ steps.compare.outputs.should_advance }}
      target_sha: ${{ steps.compare.outputs.target_sha }}
    steps:
      - name: Compare master with canary
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/master" ]; then
            echo "::error::canary.yml may only run from refs/heads/master (got ${REF})."
            exit 1
          fi
          canary_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/canary" --jq .object.sha)"
          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "master (pinned run SHA): ${TARGET_SHA}"
          echo "canary:                  ${canary_sha}"
          status="$(gh api "repos/${GH_REPO}/compare/${canary_sha}...${TARGET_SHA}" --jq .status)"
          echo "Compare canary...target: ${status}"
          if [ "${status}" = "behind" ] || [ "${status}" = "diverged" ]; then
            echo "target_sha is ${status} relative to canary; skipping."
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "should_advance=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${status}" = "identical" ]; then
            if [ "${FORCE}" = "true" ]; then
              echo "master is at canary, but force=true requested: running full gate (no ref advance)."
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "should_advance=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "master has not moved past canary; skipping."
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "should_advance=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Cap retries on the same broken SHA to 2 failed/cancelled runs unless forced, so a
          # deterministic overnight regression does not burn 24 full gates while still giving one
          # automatic retry for transient infra/flake failures (and two red runs for Meltdown
          # detection). Query by status=failure and status=cancelled separately so subsequent
          # successful skip runs can never displace earlier failures from a recent-runs window.
          if [ "${FORCE}" != "true" ]; then
            prior_failures="$(gh api \
              "repos/${GH_REPO}/actions/workflows/canary.yml/runs?head_sha=${TARGET_SHA}&status=failure&per_page=1" \
              --jq .total_count)"
            prior_cancelled="$(gh api \
              "repos/${GH_REPO}/actions/workflows/canary.yml/runs?head_sha=${TARGET_SHA}&status=cancelled&per_page=1" \
              --jq .total_count)"
            prior_unsuccessful="$((prior_failures + prior_cancelled))"
            echo "Prior unsuccessful canary runs on ${TARGET_SHA}: ${prior_unsuccessful} (failure=${prior_failures}, cancelled=${prior_cancelled})"
            if [ "${prior_unsuccessful}" -ge 2 ]; then
              echo "SHA ${TARGET_SHA} already had ${prior_unsuccessful} unsuccessful canary runs; skipping until a new commit lands or force=true."
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
              echo "should_advance=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          echo "should_run=true" >> "${GITHUB_OUTPUT}"
          echo "should_advance=true" >> "${GITHUB_OUTPUT}"

  ci:
    name: CI
    needs: check
    if: needs.check.outputs.should_run == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      tier: full
      save_caches: true
      job_prefix: "CI / "

  advance:
    name: Fast-forward canary
    needs:
      - check
      - ci
    if: >-
      needs.check.outputs.should_advance == 'true'
      && needs.ci.result == 'success'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Advance canary ref to the verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.check.outputs.target_sha }}
        run: |
          set -euo pipefail
          canary_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/canary" --jq .object.sha)"
          if [ "${TARGET_SHA}" = "${canary_sha}" ]; then
            echo "canary is already at ${TARGET_SHA}."
            exit 0
          fi
          gh api --method PATCH "repos/${GH_REPO}/git/refs/heads/canary" \
            -f sha="${TARGET_SHA}" \
            -F force=false
          echo "Advanced canary: ${canary_sha} -> ${TARGET_SHA}"

  report:
    name: Report canary failure
    needs:
      - check
      - ci
    if: >-
      always()
      && needs.check.outputs.should_run == 'true'
      && (needs.ci.result == 'failure' || needs.ci.result == 'cancelled')
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or comment on canary failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.check.outputs.target_sha }}
        run: |
          set -euo pipefail
          title="Canary: full gate failed"
          day="$(date -u +%Y-%m-%d)"
          body="The hourly canary run ended \`${RESULT}\` on ${day} at commit ${SHA}: ${RUN_URL}"
          number="$(gh api --paginate \
            "repos/${GH_REPO}/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            | jq -r --arg title "${title}" \
              '.[] | select(.pull_request == null and .title == $title) | .number' \
            | sort -n | awk 'NR == 1')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
            echo "Commented on #${number}: ${title}"
          else
            gh issue create --title "${title}" --body "${body}

This issue is opened by .github/workflows/canary.yml whenever the full gate fails on master. Close it once canary advances past the failing commit."
            echo "Opened: ${title}"
          fi
