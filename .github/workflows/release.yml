name: Release

# A version tag pushed to this repository, such as v0.2.0, builds marmot-agent for each platform the
# install scripts know, packages it with the connectors and container files (tools/release/package.sh),
# and publishes a GitHub release with a SHA256SUMS file beside the archives (D-091). Releases are not
# signed yet (Q-28): the checksums catch a broken download, not a replaced one.
#
# Rules for this file, as for ci.yml: every action is pinned to a commit, the only secret is the job's
# own token, and no job sets RUSTFLAGS. Only a tag pushed to this repository starts it, never a pull
# request, so code from a fork never runs here, and only the publish job, which runs no code from the
# checkout, may write.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: The tag is the workspace's version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v${version}" != "${TAG}" ]; then
            echo "error: the tag ${TAG} is not v${version}, the version in Cargo.toml" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    # MDK, which the core links, takes most of this to build. Releases build cold, from no cache.
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04's C library is older than 24.04's, so the Linux builds run on more machines.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Odin
        # MDK's markdown parser is written in Odin and its build needs this exact release. The script
        # pins it by version, commit and checksum.
        run: |
          bash tools/odin/install.sh "${RUNNER_TEMP}/odin"
          echo "ODIN=${RUNNER_TEMP}/odin/odin" >> "${GITHUB_ENV}"

      - name: Install the pinned toolchain
        # With no arguments this installs what rust-toolchain.toml names, with llvm-tools, which MDK's
        # optimised build needs.
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: The runner builds for the target
        # Each target builds on its own kind of machine; nothing is cross-compiled.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${host}" != "${TARGET}" ]; then
            echo "error: this runner builds for ${host}, not ${TARGET}" >&2
            exit 1
          fi

      - name: Build marmot-agent
        run: cargo build --locked --release -p marmot-agent

      - name: Package it
        env:
          TARGET: ${{ matrix.target }}
        run: tools/release/package.sh target/release/marmot-agent "${TARGET}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marmot-agent-${{ matrix.target }}
          path: dist/marmot-agent-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: marmot-agent-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum marmot-agent-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        # A tag with a suffix, such as v0.2.0-rc.1, is a pre-release, which `latest` skips.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${TAG}" in *-*) prerelease=--prerelease ;; esac
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "marmot-agent ${TAG}" \
            --notes "marmot-agent ${TAG}. Install it with a script from install/ (see README.md). Each archive's checksum is in SHA256SUMS. Releases are not signed yet." \
            ${prerelease}
