name: Release

# Four-track release workflow (D-165, D-166, #222):
#   - `marmot-agent` (tags `vX.Y.Z`, `vX.Y.Z-rc.N`): 3-platform Rust core build
#   - `claude-code`  (tags `claude-code-vX.Y.Z*`):   TypeScript driver tarball (~30-60s, no Rust)
#   - `openclaw`     (tags `openclaw-vX.Y.Z*`):      TypeScript plugin tarball (~30-60s, no Rust)
#   - `hermes`       (tags `hermes-vX.Y.Z*`):        Python plugin tarball (~30-60s, no Rust)
#
# Every release publishes SHA256SUMS and a `latest.json` compatibility manifest (track, version,
# tag, commit, socket_protocol, asset SHA-256 digests). GitHub's repository-wide "Latest" release
# always tracks the latest stable `marmot-agent` core release (`--latest=false` on connector
# releases) so install scripts downloading from `/releases/latest` keep working. Manual
# `workflow_dispatch` plans from the verified `canary` branch (`dry_run: true` by default) and can
# cut `-rc.N` prereleases directly from `canary` once the track's manifest matches the planned base
# version; stable tags (`v*`, `claude-code-v*`, `openclaw-v*`, `hermes-v*` excluding `*-rc.*`) are
# protected by the `Release tags` ruleset and must be pushed as signed tags.
#
# Rules for this file, as for ci.yml: every action is pinned to a commit, the only secret is the
# job's own token, no job sets RUSTFLAGS, and only the final `publish` job (which checks out and
# runs no repository code) holds `contents: write`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "claude-code-v[0-9]+.[0-9]+.[0-9]+"
      - "claude-code-v[0-9]+.[0-9]+.[0-9]+-*"
      - "openclaw-v[0-9]+.[0-9]+.[0-9]+"
      - "openclaw-v[0-9]+.[0-9]+.[0-9]+-*"
      - "hermes-v[0-9]+.[0-9]+.[0-9]+"
      - "hermes-v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      track:
        description: Release track to plan or cut from canary
        type: choice
        required: true
        default: marmot-agent
        options:
          - marmot-agent
          - claude-code
          - openclaw
          - hermes
      channel:
        description: Release channel (`rc` can cut directly from canary; `stable` prints signed tag steps)
        type: choice
        required: true
        default: rc
        options:
          - rc
          - stable
      dry_run:
        description: Plan only (print next version, tag, and changelog without building or publishing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || format('dispatch-{0}-{1}', inputs.track, inputs.channel) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Plan and verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      track: ${{ steps.resolve.outputs.track }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      socket_protocol: ${{ steps.resolve.outputs.socket_protocol }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      verify_existing_tag: ${{ steps.resolve.outputs.verify_existing_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve track, version, and compatibility metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            python3 tools/release/resolve_release.py \
              --tag "${REF_NAME}" \
              --commit "${HEAD_SHA}" \
              --notes-out notes/release-notes.md \
              --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${REF}" != "refs/heads/master" ]; then
            echo "::error::workflow_dispatch releases must run from refs/heads/master (got ${REF})."
            exit 1
          fi
          canary_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/canary" --jq .object.sha)"
          git checkout --detach "${canary_sha}"
          args=(
            tools/release/resolve_release.py
            --dispatch
            --ref "${canary_sha}"
            --track "${INPUT_TRACK}"
            --channel "${INPUT_CHANNEL}"
            --summary-out "${GITHUB_STEP_SUMMARY}"
            --notes-out notes/release-notes.md
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 "${args[@]}"

      - name: Upload release notes
        if: steps.resolve.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  build-core:
    name: Build marmot-agent (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && needs.plan.outputs.track == 'marmot-agent'
    runs-on: ${{ matrix.runner }}
    # MDK, which the core links, takes most of this to build. Releases build cold, from no cache.
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04's C library is older than 24.04's, so the Linux builds run on more machines.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Install Odin
        # MDK's markdown parser is written in Odin and its build needs this exact release. The script
        # pins it by version, commit and checksum.
        run: |
          bash tools/odin/install.sh "${RUNNER_TEMP}/odin"
          echo "ODIN=${RUNNER_TEMP}/odin/odin" >> "${GITHUB_ENV}"

      - name: Install the pinned toolchain
        # With no arguments this installs what rust-toolchain.toml names, with llvm-tools, which MDK's
        # optimised build needs.
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: The runner builds for the target
        # Each target builds on its own kind of machine; nothing is cross-compiled.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${host}" != "${TARGET}" ]; then
            echo "error: this runner builds for ${host}, not ${TARGET}" >&2
            exit 1
          fi

      - name: Build marmot-agent
        run: cargo build --locked --release -p marmot-agent

      - name: Package it
        env:
          TARGET: ${{ matrix.target }}
        run: tools/release/package.sh target/release/marmot-agent "${TARGET}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marmot-agent-${{ matrix.target }}
          path: dist/marmot-agent-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-connector:
    name: Package ${{ needs.plan.outputs.track }}
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && needs.plan.outputs.track != 'marmot-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - if: needs.plan.outputs.track == 'claude-code' || needs.plan.outputs.track == 'openclaw'
        uses: ./.github/actions/node

      - if: needs.plan.outputs.track == 'hermes'
        uses: ./.github/actions/python

      - name: Verify connector before packaging
        env:
          TRACK: ${{ needs.plan.outputs.track }}
        run: |
          set -euo pipefail
          case "${TRACK}" in
            claude-code)
              (cd packages/claude-code && npm ci && npm run check && npm test)
              ;;
            openclaw)
              (cd packages/openclaw && npm ci && npm run check && npm test && npm run build)
              ;;
            hermes)
              (cd python && python3 -m unittest discover -s tests)
              ;;
            *)
              echo "::error::Unexpected connector track '${TRACK}'."
              exit 1
              ;;
          esac

      - name: Package connector tarball
        env:
          TRACK: ${{ needs.plan.outputs.track }}
        run: tools/release/package_connector.sh "${TRACK}" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marmot-agent-${{ needs.plan.outputs.track }}
          path: dist/marmot-agent-${{ needs.plan.outputs.track }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Write SHA256SUMS and latest.json
    needs:
      - plan
      - build-core
      - build-connector
    if: >-
      always()
      && needs.plan.outputs.should_build == 'true'
      && needs.plan.result == 'success'
      && needs.build-core.result != 'failure'
      && needs.build-core.result != 'cancelled'
      && needs.build-connector.result != 'failure'
      && needs.build-connector.result != 'cancelled'
      && (needs.build-core.result == 'success' || needs.build-connector.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            tools/release
            tools/ci
            fixtures/socket

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: marmot-agent-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and latest.json
        env:
          TRACK: ${{ needs.plan.outputs.track }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PROTOCOL: ${{ needs.plan.outputs.socket_protocol }}
        run: |
          set -euo pipefail
          python3 tools/release/write_manifest.py \
            --dir dist \
            --track "${TRACK}" \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --commit "${COMMIT}" \
            --socket-protocol "${PROTOCOL}"
          cat dist/SHA256SUMS
          cat dist/latest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs:
      - plan
      - finalize
    # Explicit !cancelled() avoids GitHub Actions' implicit success() skipping this job because
    # build-core or build-connector was skipped upstream of finalize (actions/runner#491).
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.should_build == 'true'
      && needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ needs.plan.outputs.track }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          VERIFY_TAG: ${{ needs.plan.outputs.verify_existing_tag }}
        run: |
          set -euo pipefail
          args=(
            release create "${TAG}" dist/*
            --repo "${GITHUB_REPOSITORY}"
            --title "${TRACK} ${TAG}"
            --notes-file notes/release-notes.md
          )
          if [ "${VERIFY_TAG}" = "true" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "${COMMIT}")
          fi
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          elif [ "${TRACK}" = "marmot-agent" ]; then
            args+=(--latest)
          else
            # Keep GitHub's repository-wide "Latest" release pointing at marmot-agent core so
            # install/lib.sh's default `/releases/latest/download/marmot-agent-<target>.tar.gz`
            # never breaks when a connector release ships.
            args+=(--latest=false)
          fi
          gh "${args[@]}"
