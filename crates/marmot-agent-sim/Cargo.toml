[package]
name = "marmot-agent-sim"
description = "A deterministic simulator of the core: the real core with a simulated MDK and a scripted driver, on a virtual clock, from a seed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Puts back bugs fixed before, so the tests can show the simulator finds each. Never in a release.
bugs = ["marmot-agent/sim-bugs"]

[dependencies]
marmot-agent = { path = "../marmot-agent" }
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
# MDK's reading of an agent item, so the simulated MDK refuses what MDK would. At the revision the
# core depends on, and moved with it.
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "6f6b427b34cc212be62d07517a6aff5879bf52e8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The virtual clock is tokio's paused time, which needs `test-util`.
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
# The core's state file, one folder for each run.
tempfile = "3"
