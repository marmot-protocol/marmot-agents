[package]
name = "marmot-agent-codex"
description = "The Codex driver: speaks codex app-server and produces agent events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps Codex's own message as the exact text it arrived as.
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
