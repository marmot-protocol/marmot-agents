[package]
name = "marmot-agent-codex"
description = "The Codex driver: speaks codex app-server and produces agent events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps Codex's own message as the exact text it arrived as.
serde_json = { version = "1", features = ["raw_value"] }
# Runs Codex and reads it without blocking the core, and gives up on a Codex that never answers.
tokio = { version = "1", features = ["io-util", "process", "time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# `test-util` pauses the clock, so a wait of a minute is tested in no time.
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "test-util", "time"] }
serde_json = { version = "1", features = ["raw_value"] }
