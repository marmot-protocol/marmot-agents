[package]
name = "marmot-agent"
description = "The core program: the agent's member of a Marmot group, and what it does with each message"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent-acp = { path = "../marmot-agent-acp" }
marmot-agent-codex = { path = "../marmot-agent-codex" }
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
marmot-agent-pi = { path = "../marmot-agent-pi" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The standing settings are one TOML file (D-073).
toml = "0.9"
hex = "0.4"
# An owner's npub, read by `marmot-agent key` for the install scripts.
bech32 = "0.12"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The connector's token.
getrandom = "0.3"
# Opening a file the agent sends one part of its path at a time, from a folder held open, so no
# link leads out of it (D-090).
rustix = { version = "1", features = ["fs"] }
# MDK, as a library (D-002). The revision moves together with the [patch] entries in the workspace
# Cargo.toml and tools/odin/install.sh.
marmot-app = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bf4778a3388be58006a498ba84bf5df541630220" }
marmot-account = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bf4778a3388be58006a498ba84bf5df541630220" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bf4778a3388be58006a498ba84bf5df541630220" }

[dev-dependencies]
# MDK's test relay, and its storage settings for tests.
nostr-relay-builder = "0.44"
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bf4778a3388be58006a498ba84bf5df541630220", features = ["test-support"] }
tempfile = "3"
# The stand-in Blossom server in the file test names each blob by its hash.
sha2 = "0.10"
# The import test runs today's connector, wn-agent, from MDK at the same revision, and speaks to
# its socket.
agent-connector = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bf4778a3388be58006a498ba84bf5df541630220" }
agent-control = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bf4778a3388be58006a498ba84bf5df541630220" }
# The Claude Code scenario runs the driver as a program.
tokio = { version = "1", features = ["process"] }
