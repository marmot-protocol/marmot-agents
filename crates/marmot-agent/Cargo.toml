[package]
name = "marmot-agent"
description = "The core program: the agent's member of a Marmot group, and what it does with each message"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent-acp = { path = "../marmot-agent-acp" }
marmot-agent-codex = { path = "../marmot-agent-codex" }
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
marmot-agent-pi = { path = "../marmot-agent-pi" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The standing settings are one TOML file (D-073).
toml = "0.9"
hex = "0.4"
# An owner's npub, in the settings (NIP-19) and for `marmot-agent key`.
bech32 = "0.12"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The connector's token, and the salt of the tokens sends are handed to MDK under.
getrandom = "0.3"
# Those tokens are digests, as MDK takes at most 128 bytes; the stand-in Blossom server in the
# file test names each blob by its hash.
sha2 = "0.10"
# Opening a file the agent sends one part of its path at a time, from a folder held open, so no
# link leads out of it (D-090).
rustix = { version = "1", features = ["fs"] }
# MDK, as a library (D-002). The revision moves together with the [patch] entries in the workspace
# Cargo.toml and tools/odin/install.sh.
marmot-app = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
marmot-account = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
# MDK's SQLite, which is SQLCipher, started on one thread before MDK opens a database
# (`marmot::start_sqlite`). The version is MDK's, so it is the same library.
rusqlite = { version = "0.40.1", default-features = false }

[dev-dependencies]
# Property tests (docs/design/verification.md, "6. Property tests"): tests/properties.
proptest = "1.12"
# The socket's JSON Schema, made from its message types (`fixtures/socket/schema.json`), with the
# events crate's.
schemars = "1"
marmot-agent-events = { path = "../marmot-agent-events", features = ["schema"] }
# MDK's test relay, and its storage settings for tests.
nostr-relay-builder = "0.44"
tokio-tungstenite = "0.28"
futures-util = "0.3"
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da", features = ["test-support"] }
tempfile = "3"
# The import test runs today's connector, wn-agent, from MDK at the same revision, and speaks to
# its socket.
agent-connector = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
agent-control = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
# The Claude Code scenario runs the driver as a program.
tokio = { version = "1", features = ["process", "test-util"] }
# The socket connectors run the driver conformance suite over the socket (tests/conformance_socket.rs).
marmot-agent-conformance = { path = "../marmot-agent-conformance" }

# Kani's bounded proofs are built only under `cargo kani`, which sets `cfg(kani)`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
# Bugs fixed before, put back on purpose for the simulator (`crates/marmot-agent-sim`), which
# shows it finds each. Off by default, and never in a release.
sim-bugs = []
