[package]
name = "marmot-agent-chat"
description = "A terminal client that plays the person, for trying the core by hand"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent = { path = "../marmot-agent" }
marmot-agent-events = { path = "../marmot-agent-events" }
hex = "0.4"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
# A relay on this machine, so a try needs nothing else running.
nostr-relay-builder = "0.44"
# MDK, at the core's revision.
marmot-app = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
marmot-account = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }

[dev-dependencies]
serde_json = "1"
