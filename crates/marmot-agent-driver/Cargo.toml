[package]
name = "marmot-agent-driver"
description = "The trait every Rust driver implements, and what a driver says it supports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent-events = { path = "../marmot-agent-events" }

[dev-dependencies]
# The tests build an event with a native payload, which is raw JSON.
serde_json = { version = "1", features = ["raw_value"] }
