[package]
name = "marmot-agent-fuzz"
description = "Fuzz targets for everything that reads input from outside the core, and the checks each makes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cargo-fuzz finds its targets here (`cargo fuzz run --fuzz-dir crates/marmot-agent-fuzz`). The
# checks are the library, which a stable test runs over the seeds; the targets are thin. Every
# `[[bin]]` here is a target, as cargo-fuzz lists them, so what writes the seeds is an example
# (`examples/seeds.rs`).
[package.metadata]
cargo-fuzz = true

[dependencies]
marmot-agent = { path = "../marmot-agent" }
marmot-agent-acp = { path = "../marmot-agent-acp" }
# D-007's check of a translator, which the translators' property uses too.
marmot-agent-conformance = { path = "../marmot-agent-conformance" }
marmot-agent-codex = { path = "../marmot-agent-codex" }
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
marmot-agent-pi = { path = "../marmot-agent-pi" }
# MDK's own reader of kinds 1201 and 1202, which the core must agree with. The revision is the
# core's.
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "bea7b400b78f3ec6d1abb3894d1d8162bdf409da" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The socket's target runs the real connection reader on a socket pair.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
# Only the fuzz targets link libFuzzer, and only when cargo-fuzz builds them with this feature.
libfuzzer-sys = { version = "0.4.13", optional = true }

[features]
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "socket_lines"
path = "fuzz_targets/socket_lines.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "socket_hello"
