[package]
name = "marmot-agent-conformance"
description = "The driver conformance suite: one set of scenarios and checks every driver must pass, with scriptable fake harnesses"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
marmot-agent-driver = { path = "../marmot-agent-driver" }
marmot-agent-events = { path = "../marmot-agent-events" }
serde_json = { version = "1", features = ["raw_value"] }
# The fakes run as tasks on in-memory pipes, and Pi's on a Unix socket its stand-in program
# connects to; the suite waits with timeouts.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# Pi's fake listens on a socket in a throwaway folder.
tempfile = "3"

[dev-dependencies]
# The translators over recordings changed at random (tests/translators.rs).
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
marmot-agent-acp = { path = "../marmot-agent-acp" }
marmot-agent-codex = { path = "../marmot-agent-codex" }
marmot-agent-pi = { path = "../marmot-agent-pi" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
